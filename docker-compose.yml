services:
  # MinIO S3 Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: metamapa-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - metamapa-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: metamapa-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-metamapa_db}
      - POSTGRES_USER=${POSTGRES_USER:-metamapa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-metamapa123}
    restart: unless-stopped
    networks:
      - metamapa-network

  # CouchDB Database
  couchdb:
    image: couchdb:3.3
    container_name: metamapa-couchdb
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-admin123}
    restart: unless-stopped
    networks:
      - metamapa-network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metamapa-pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@metamapa.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - metamapa-network

  # Fuentes Estáticas
  fuente-estatica:
    build:
      context: ./apps/fuentes/estatica
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    container_name: metamapa-fuente-estatica
    restart: unless-stopped
    environment:
      - DAO_TYPE=${FUENTE_ESTATICA_DAO_TYPE:-s3}
      - PROCESSOR_TYPE=csv
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      - minio
    networks:
      - metamapa-network

  # Fuentes Dinámicas
  fuente-dinamica:
    build:
      context: ./apps/fuentes/dinamica
      dockerfile: Dockerfile
    ports:
      - "7002:7002"
    container_name: metamapa-fuente-dinamica
    restart: unless-stopped
    environment:
      - DAO_TYPE=${FUENTE_DINAMICA_DAO_TYPE:-filesystem}
    depends_on:
      - couchdb
    networks:
      - metamapa-network

  # Proxy MetaMapa
  fuente-proxy-metamapa:
    build:
      context: ./apps/fuentes/proxy/metamapa
      dockerfile: Dockerfile
    ports:
      - "7003:7003"
    container_name: metamapa-fuente-proxy-metamapa
    restart: unless-stopped
    environment:
      - URL = https://56d05c91-ca57-4d58-acd5-6d61368e622a.mock.pstmn.io
    networks:
      - metamapa-network

  # Proxy Demo
  fuente-proxy-demo:
    build:
      context: ./apps/fuentes/proxy/demo
      dockerfile: Dockerfile
    ports:
      - "7004:7004"
    container_name: metamapa-fuente-proxy-demo
    restart: unless-stopped
    environment:
      - DAO_TYPE=${FUENTE_PROXY_DEMO_DAO_TYPE:-filesystem}
    depends_on:
      - couchdb
    networks:
      - metamapa-network

  # Agregador
  agregador:
    build:
      context: ./apps/agregador
      dockerfile: Dockerfile
    ports:
      - "7005:7005"
    container_name: metamapa-agregador
    restart: unless-stopped
    environment:
      - DAO_TYPE=${AGREGADOR_DAO_TYPE:-hibernate}
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-metamapa_db}
      - DB_USER=${POSTGRES_USER:-metamapa}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-metamapa123}
    depends_on:
      - postgres
    networks:
      - metamapa-network

  # Normalizador
  normalizador:
    build:
      context: ./apps/normalizador
      dockerfile: Dockerfile
    ports:
      - "7099:7099"
    container_name: metamapa-normalizador
    restart: unless-stopped
    networks:
      - metamapa-network

  # MetaMapa
  metamapa:
    build:
      context: ./apps/metamapa
      dockerfile: Dockerfile
    ports:
      - "7006:7006"
    container_name: metamapa-administrativo
    restart: unless-stopped
    environment:
      - DAO_TYPE=${METAMAPA_DAO_TYPE:-hibernate}
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-metamapa_db}
      - DB_USER=${POSTGRES_USER:-metamapa}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-metamapa123}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - postgres
    networks:
      - metamapa-network

  # Prometheus
  metric-collector:
    image: prom/prometheus:latest
    container_name: metric-collector
    volumes:
      - ./apps/estadisticas/metric-collector/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - agregador
      - metamapa
    networks:
      - metamapa-network

  # Alertmanager
  gestor-alertas:
    image: prom/alertmanager:latest
    container_name: gestor-alertas
    volumes:
      - ./apps/estadisticas/gestor-alertas/config.yml:/etc/alertmanager/config.yml
    command:
      - "--config.file=/etc/alertmanager/config.yml"
    ports:
      - "9093:9093"
    depends_on:
      - metric-collector
    networks:
      - metamapa-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: metamapa-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - postgres
      - metric-collector
    restart: unless-stopped
    networks:
      - metamapa-network

  # Scheduler para Proxy Demo
  scheduler-proxy-demo:
    build:
      context: ./apps/scheduler
      dockerfile: Dockerfile
    container_name: scheduler-proxy-demo
    restart: unless-stopped
    environment:
      - TARGET_URL=http://fuente-proxy-demo:7004/hechos
      - HTTP_METHOD=PUT
      - INTERVAL_SECONDS=3600
    depends_on:
      - fuente-proxy-demo
    networks:
      - metamapa-network
  # Scheduler para Agregador
  scheduler-agregador:
    build:
      context: ./apps/scheduler
      dockerfile: Dockerfile
    container_name: scheduler-agregador
    restart: unless-stopped
    environment:
      - TARGET_URL=http://agregador:7005/agregacion
      - HTTP_METHOD=POST
      - INTERVAL_SECONDS=60
    depends_on:
      - agregador
    networks:
      - metamapa-network

volumes:
  minio_data:
  postgres_data:
  pgadmin_data:
  couchdb_data:
  couchdb_config:
  grafana_data:

networks:
  metamapa-network:
    driver: bridge
