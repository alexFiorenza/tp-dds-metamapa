service: metamapa-fuentes

frameworkVersion: '3'

provider:
  name: aws
  runtime: java17
  region: us-east-1
  stage: prod
  memorySize: 1024
  timeout: 30

  environment:
    # OpenTelemetry configuration
    AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-handler
    OTEL_TRACES_SAMPLER: AlwaysOn
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - traceparent
        - baggage
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: false
      maxAge: 3600

  logs:
    httpApi: true
    frameworkLambda: true

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'

package:
  individually: true

functions:
  estatica:
    handler: utn.dds.fuentes.estatica.LambdaHandler
    description: 'Fuente de datos estáticas (CSV desde S3)'
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-java-agent-amd64-ver-1-32-0:3
    package:
      artifact: estatica/target/fuente-estatica-1.0-SNAPSHOT.jar
    events:
      - httpApi:
          path: /estatica/hechos
          method: get
    environment:
      OTEL_SERVICE_NAME: fuente-estatica
      DAO_TYPE: ${env:FUENTE_ESTATICA_DAO_TYPE, 's3'}
      PROCESSOR_TYPE: csv
      S3_ENDPOINT: ${env:S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${env:S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${env:AWS_ACCESS_KEY_ID}
      S3_SECRET_KEY: ${env:AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${env:S3_BUCKET_ESTATICA}
    memorySize: 1536
    timeout: 28

  dinamica:
    handler: utn.dds.fuentes.dinamica.LambdaHandler
    description: 'Fuente de datos dinámicas (MongoDB/DocumentDB)'
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-java-agent-amd64-ver-1-32-0:3
    package:
      artifact: dinamica/target/fuente-dinamica-1.0-SNAPSHOT.jar
    events:
      - httpApi:
          path: /dinamica/hechos
          method: get
      - httpApi:
          path: /dinamica/hechos
          method: post
      - httpApi:
          path: /dinamica/hechos/{uuid}
          method: patch
    environment:
      OTEL_SERVICE_NAME: fuente-dinamica
      DAO_TYPE: ${env:FUENTE_DINAMICA_DAO_TYPE, 'mongodb'}
      MONGODB_URI: ${env:MONGODB_URI}
      MONGODB_DB: ${env:MONGODB_DB_DINAMICA, 'dinamica_db'}
      S3_ENDPOINT: ${env:S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${env:S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${env:AWS_ACCESS_KEY_ID}
      S3_SECRET_KEY: ${env:AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${env:S3_BUCKET_DINAMICA}
    memorySize: 1536
    timeout: 28

  metamapa:
    handler: utn.dds.fuentes.proxy.metamapa.LambdaHandler
    description: 'Proxy para servicio principal de MetaMapa'
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-java-agent-amd64-ver-1-32-0:3
    package:
      artifact: proxy/metamapa/target/fuente-proxy-metamapa-1.0-SNAPSHOT.jar
    events:
      - httpApi:
          path: /metamapa/hechos
          method: get
    environment:
      OTEL_SERVICE_NAME: fuente-proxy-metamapa
      URL: ${env:METAMAPA_PROXY_URL, 'https://56d05c91-ca57-4d58-acd5-6d61368e622a.mock.pstmn.io'}
    memorySize: 1024
    timeout: 28

  demo:
    handler: utn.dds.fuentes.proxy.demo.LambdaHandler
    description: 'Proxy demo para pruebas y desarrollo'
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-java-agent-amd64-ver-1-32-0:3
    package:
      artifact: proxy/demo/target/fuente-proxy-demo-1.0-SNAPSHOT.jar
    events:
      - httpApi:
          path: /demo/hechos
          method: get
      - httpApi:
          path: /demo/hechos
          method: put
    environment:
      OTEL_SERVICE_NAME: fuente-proxy-demo
      DAO_TYPE: ${env:FUENTE_PROXY_DEMO_DAO_TYPE, 'mongodb'}
      MONGODB_URI: ${env:MONGODB_URI}
      MONGODB_DB: ${env:MONGODB_DB_PROXY_DEMO, 'proxy_demo_db'}
    memorySize: 1024
    timeout: 28
