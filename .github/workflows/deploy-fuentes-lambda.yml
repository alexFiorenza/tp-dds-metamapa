name: Deploy Fuentes to AWS Lambda

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/fuentes/**'
      - 'apps/shared/**'
      - '.github/workflows/deploy-fuentes-lambda.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JARs with Maven
        run: |
          mvn clean package -DskipTests
        working-directory: .

      - name: Verify JARs were created
        run: |
          echo "Checking for JAR files..."
          ls -lh apps/fuentes/estatica/target/*.jar
          ls -lh apps/fuentes/dinamica/target/*.jar
          ls -lh apps/fuentes/proxy/metamapa/target/*.jar
          ls -lh apps/fuentes/proxy/demo/target/*.jar

      - name: Setup Node.js (for Serverless Framework)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda (Development)
        if: github.ref == 'refs/heads/develop'
        run: |
          serverless deploy --stage dev --verbose
        working-directory: apps/fuentes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Fuente Estática
          FUENTE_ESTATICA_DAO_TYPE: ${{ secrets.FUENTE_ESTATICA_DAO_TYPE_DEV }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_DEV }}
          S3_PUBLIC_ENDPOINT: ${{ secrets.S3_PUBLIC_ENDPOINT_DEV }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_DEV }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_DEV }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_DEV }}
          # Fuente Dinámica
          FUENTE_DINAMICA_DAO_TYPE: ${{ secrets.FUENTE_DINAMICA_DAO_TYPE_DEV }}
          COUCHDB_URL: ${{ secrets.COUCHDB_URL_DEV }}
          COUCHDB_USER: ${{ secrets.COUCHDB_USER_DEV }}
          COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD_DEV }}
          COUCHDB_DB_DINAMICA: ${{ secrets.COUCHDB_DB_DINAMICA_DEV }}
          S3_BUCKET_DINAMICA: ${{ secrets.S3_BUCKET_DINAMICA_DEV }}
          # Proxy MetaMapa
          METAMAPA_PROXY_URL: ${{ secrets.METAMAPA_PROXY_URL_DEV }}
          # Proxy Demo
          FUENTE_PROXY_DEMO_DAO_TYPE: ${{ secrets.FUENTE_PROXY_DEMO_DAO_TYPE_DEV }}
          COUCHDB_DB_PROXY_DEMO: ${{ secrets.COUCHDB_DB_PROXY_DEMO_DEV }}

      - name: Deploy to AWS Lambda (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          serverless deploy --stage prod --verbose
        working-directory: apps/fuentes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Fuente Estática
          FUENTE_ESTATICA_DAO_TYPE: ${{ secrets.FUENTE_ESTATICA_DAO_TYPE_PROD }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_PROD }}
          S3_PUBLIC_ENDPOINT: ${{ secrets.S3_PUBLIC_ENDPOINT_PROD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_PROD }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_PROD }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_PROD }}
          # Fuente Dinámica
          FUENTE_DINAMICA_DAO_TYPE: ${{ secrets.FUENTE_DINAMICA_DAO_TYPE_PROD }}
          COUCHDB_URL: ${{ secrets.COUCHDB_URL_PROD }}
          COUCHDB_USER: ${{ secrets.COUCHDB_USER_PROD }}
          COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD_PROD }}
          COUCHDB_DB_DINAMICA: ${{ secrets.COUCHDB_DB_DINAMICA_PROD }}
          S3_BUCKET_DINAMICA: ${{ secrets.S3_BUCKET_DINAMICA_PROD }}
          # Proxy MetaMapa
          METAMAPA_PROXY_URL: ${{ secrets.METAMAPA_PROXY_URL_PROD }}
          # Proxy Demo
          FUENTE_PROXY_DEMO_DAO_TYPE: ${{ secrets.FUENTE_PROXY_DEMO_DAO_TYPE_PROD }}
          COUCHDB_DB_PROXY_DEMO: ${{ secrets.COUCHDB_DB_PROXY_DEMO_PROD }}

      - name: Get deployed endpoints
        id: endpoints
        run: |
          STAGE=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          serverless info --stage $STAGE
        working-directory: apps/fuentes

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌍 Region: ${{ env.AWS_REGION }}"
          echo "🏷️  Stage: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
          echo "📦 Service: metamapa-fuentes"
          echo ""
          echo "Deployed functions:"
          echo "  - fuente-estatica: GET /estatica/hechos"
          echo "  - fuente-dinamica: GET/POST /dinamica/hechos"
          echo "  - proxy-metamapa: GET /metamapa/hechos"
          echo "  - proxy-demo: GET/PUT /demo/hechos"
