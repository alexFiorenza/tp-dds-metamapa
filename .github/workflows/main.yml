name: CI/CD Rama Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar con Maven
      run: mvn clean package -DskipTests

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: apps/ui-admin/yarn.lock

    - name: Instalar dependencias ui-admin
      run: |
        cd apps/ui-admin
        yarn install --frozen-lockfile

    - name: Compilar ui-admin
      env:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        NEXT_PUBLIC_USE_MOCK: ${{ secrets.NEXT_PUBLIC_USE_MOCK }}
      run: |
        cd apps/ui-admin
        yarn build

    - name: Instalar dependencias normalizador
      run: |
        cd apps/normalizador
        npm ci

    - name: Compilar normalizador
      run: |
        cd apps/normalizador
        npm run build

    - name: Set up Docker Buildx
      if: github.event_name == 'push'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Fuentes Estáticas
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/fuentes/estatica
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-estatica:${{ env.DOCKER_TAG }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-estatica:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-estatica:buildcache,mode=max

    - name: Build and push Fuentes Dinámicas
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/fuentes/dinamica
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-dinamica:${{ env.DOCKER_TAG }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-dinamica:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-dinamica:buildcache,mode=max

    - name: Build and push Proxy MetaMapa
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/fuentes/proxy/metamapa
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-metamapa:${{ env.DOCKER_TAG }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-metamapa:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-metamapa:buildcache,mode=max

    - name: Build and push Proxy Demo
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/fuentes/proxy/demo
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-demo:${{ env.DOCKER_TAG }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-demo:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-demo:buildcache,mode=max

    - name: Build and push Agregador
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/agregador
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-agregador:${{ env.DOCKER_TAG }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-agregador:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-agregador:buildcache,mode=max

    - name: Build and push MetaMapa Gestor
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./apps/metamapa
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-gestor:${{ env.DOCKER_TAG }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-gestor:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/metamapa-gestor:buildcache,mode=max

    - name: Summary - Pull Request
      if: github.event_name == 'pull_request'
      run: |
        echo "✅ Compilación completada exitosamente!"
        echo ""
        echo "📦 Componentes compilados:"
        echo "  - Java: fuentes (estatica, dinamica, proxy/metamapa, proxy/demo), agregador, gestor"
        echo "  - TypeScript: normalizador, ui-admin"
        echo ""
        echo "ℹ️  No se generaron imágenes Docker (solo en push)"
        echo "ℹ️  No se desplegó a AWS Lambda (solo en push con cambios en apps/fuentes/**)"

    - name: Summary - Push
      if: github.event_name == 'push'
      run: |
        echo "✅ Build, compilación y push completados exitosamente!"
        echo ""
        echo "📦 Imágenes pusheadas a Docker Hub con tag: ${{ env.DOCKER_TAG }}"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-estatica:${{ env.DOCKER_TAG }}"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-fuentes-dinamica:${{ env.DOCKER_TAG }}"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-metamapa:${{ env.DOCKER_TAG }}"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-proxy-demo:${{ env.DOCKER_TAG }}"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-agregador:${{ env.DOCKER_TAG }}"
        echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/metamapa-gestor:${{ env.DOCKER_TAG }}"
        echo ""
        echo "ℹ️  AWS Lambda: Se desplegará si hubo cambios en apps/fuentes/** (workflow separado)"
